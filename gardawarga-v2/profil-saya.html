<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - GardaWarga</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">GW</div>
        <div class="logo-text"><strong>GARDAWARGA</strong><small>Kepedulian Masyarakat & Lingkungan</small></div>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="profil.html">Profil</a>
        <a href="berita.html">Berita</a>
        <a href="jadwal.html">Jadwal</a>
        <a href="forum.html">Forum</a>
        <a href="pengaduan.html">Pengaduan</a>
        <a href="program.html">Program</a>
      </nav>
      <div class="nav-right" id="navRight"></div>
      <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <section class="page-header">
    <div class="container"><h1>Profil Saya</h1><p>Kelola data akun Anda</p></div>
  </section>

  <section class="page-content">
    <div class="container">
      <div class="card" style="max-width:500px; margin:0 auto" id="profilCard">
        <p style="color:var(--text-muted)">Memuat...</p>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container"><div class="footer-bottom">&copy; 2026 GardaWarga</div></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await App.wait();
      const user=App.getUser();
      if(!user){window.location.href='login.html';return;}
      document.getElementById('profilCard').innerHTML=
        '<div style="text-align:center;margin-bottom:20px"><div style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 12px">'+
        (user.nama||'W').charAt(0).toUpperCase()+'</div><h2 style="color:var(--primary)">'+(user.nama||'Warga')+'</h2></div>'+
        '<div class="form-group"><label>Email</label><input type="text" value="'+(user.email||'')+'" readonly></div>'+
        '<div class="form-group"><label>No. HP</label><input type="text" value="'+(user.hp||'-')+'" readonly></div>'+
        '<div class="form-group"><label>RT / RW</label><input type="text" value="RT '+(user.rt||'-')+' / RW '+(user.rw||'-')+'" readonly></div>'+
        '<div style="display:flex;gap:10px;margin-top:16px"><a href="dashboard.html" class="btn-outline" style="flex:1;text-align:center">Dashboard</a>'+
        '<button class="btn-submit" style="flex:1;background:var(--red)" id="logoutProfile">Logout</button></div>';
      document.getElementById('logoutProfile').onclick=()=>App.logout();
    });
  </script>
</body>
</html>
