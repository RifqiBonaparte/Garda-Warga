<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - GardaWarga</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">GW</div>
        <div class="logo-text"><strong>GARDAWARGA</strong><small>Kepedulian Masyarakat & Lingkungan</small></div>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="profil.html">Profil</a>
        <a href="berita.html">Berita</a>
        <a href="jadwal.html">Jadwal</a>
        <a href="forum.html">Forum</a>
        <a href="pengaduan.html">Pengaduan</a>
        <a href="program.html">Program</a>
      </nav>
      <div class="nav-right" id="navRight"></div>
      <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <section class="page-header">
    <div class="container"><h1>Daftar Akun</h1><p>Bergabung dengan komunitas GardaWarga</p></div>
  </section>

  <section class="page-content">
    <div class="auth-box">
      <h2><i class="fas fa-user-plus"></i> Daftar</h2>
      <div id="alertBox"></div>
      <form id="formReg">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="nama" required placeholder="Nama Anda">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="email@contoh.com">
        </div>
        <div class="form-group">
          <label>No. HP</label>
          <input type="tel" id="hp" placeholder="08xxxxxxxxxx">
        </div>
        <div class="form-group">
          <label>RT / RW</label>
          <div style="display:flex; gap:10px">
            <input type="text" id="rt" placeholder="RT" style="flex:1">
            <input type="text" id="rw" placeholder="RW" style="flex:1">
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Minimal 6 karakter">
        </div>
        <button type="submit" class="btn-submit" style="width:100%">Daftar</button>
      </form>
      <p style="text-align:center; margin-top:16px; font-size:0.9rem">
        Sudah punya akun? <a href="login.html" style="color:var(--accent);font-weight:600">Login</a>
      </p>
    </div>
  </section>

  <footer class="footer"><div class="container"><div class="footer-bottom">&copy; 2026 GardaWarga</div></div></footer>
  <script src="app.js"></script>
  <script>
    document.getElementById('formReg').addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const email = document.getElementById('email').value;
      const registered = App.registerAccount({
        nama, email,
        hp: document.getElementById('hp').value || '-',
        rt: document.getElementById('rt').value || '-',
        rw: document.getElementById('rw').value || '-',
        password: document.getElementById('password').value
      });
      if (!registered) {
        document.getElementById('alertBox').innerHTML = '<div class="alert" style="background:#ffebee;color:#c62828;border:1px solid #ef9a9a">Email sudah terdaftar atau tidak dapat digunakan.</div>';
        return;
      }
      document.getElementById('alertBox').innerHTML = '<div class="alert alert-success">Registrasi berhasil! Mengalihkan ke Dashboard...</div>';
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    });
  </script>
</body>
</html>
